[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-review"
version = "0.1.0"
description = "A local Analyst, Critic, and Judge review workflow"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32,<2", "python-dotenv>=1.0,<2", "httpx>=0.28,<0.29",
    "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["ruff>=0.17,<0.18"]

[tool.setuptools.packages.find]
include = ["review_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs", ".tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
